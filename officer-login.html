<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forest Officer Login - Living Lens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Iosevka+Charon:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body>
    <header id="navbar"></header>

    <main class="page-wrapper">
      <div class="auth-panel-container">
        <section class="panel">
          <header class="panel-header">
            <h2>Forest Officer Login</h2>
          </header>

          <div class="panel-body">
            <form id="officer-login-form" novalidate>
              <div class="form-group">
                <label for="protected-area-id" class="form-label">Protected area ID</label>
                <input
                  type="text"
                  id="protected-area-id"
                  name="zoo_id"
                  class="pill-input"
                  placeholder="Enter your assigned protected area ID"
                  required
                />
              </div>

              <div class="form-group">
                <label for="officer-username" class="form-label">Username</label>
                <input
                  type="text"
                  id="officer-username"
                  name="username"
                  class="pill-input"
                  placeholder="Enter your username"
                  required
                />
              </div>

              <div class="form-group">
                <label for="employee-badge-id" class="form-label">Employee or badge ID</label>
                <input
                  type="text"
                  id="employee-badge-id"
                  name="keeper_id"
                  class="pill-input"
                  placeholder="Enter your employee or badge ID"
                  required
                />
              </div>

              <div class="auth-submit-row">
                <button type="submit" class="action-btn">Sign In</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </main>

    <script type="module">
      import { saveUser } from './js/auth.js';
      import { setupFormValidation, showError } from './js/forms.js';
      import { forestOfficerLogin } from './js/api.js';
      import './js/nav.js';

      const form = document.getElementById('officer-login-form');
      setupFormValidation(form, async (data) => {
        try {
          const payload = {
            username: data.username,
            keeper_id: data.keeper_id,
            zoo_id: data.zoo_id
          };

          const response = await forestOfficerLogin(payload);

          saveUser({
            ...response,
            role: 'forest_officer',
            username: response?.username || payload.username,
            keeper_id: response?.keeper_id || payload.keeper_id,
            zoo_id: response?.zoo_id || payload.zoo_id,
            protected_area_id: response?.protected_area_id || response?.protectedAreaId || payload.zoo_id,
            designation: response?.designation || response?.position,
            employee_id: response?.employee_id || response?.employeeId || payload.keeper_id,
            signedInAt: new Date().toISOString()
          });

          window.location.href = 'observations.html';
        } catch (error) {
          const input = document.getElementById('employee-badge-id');
          showError(input, error.message || 'Unable to sign in. Please check your credentials.');
        }
      });
    </script>
  </body>
</html>
