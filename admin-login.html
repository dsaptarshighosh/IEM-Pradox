<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in as Zoo admin - Living Lens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Iosevka+Charon:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body>
    <header id="navbar"></header>

    <main class="page-wrapper">
      <div class="auth-panel-container">
        <section class="panel">
          <header class="panel-header">
            <h2>Sign in as Zoo admin</h2>
          </header>

          <div class="panel-body">
            <form id="admin-login-form" novalidate>
              <div class="form-group">
                <label for="zoo-id-select" class="form-label">Zoo ID / Registered Zoo Identifier</label>
                <div class="select-wrapper">
                  <select id="zoo-id-select" name="zooId" class="pill-input" required>
                    <option value="" disabled selected>Select registered zoo identifier...</option>
                    <option value="ZOO-LON-01">ZOO-LON-01 (Metropolitan City Zoo)</option>
                    <option value="ZOO-SGP-02">ZOO-SGP-02 (Central Wildlife Park)</option>
                    <option value="ZOO-SDG-03">ZOO-SDG-03 (Highland Biosphere)</option>
                    <option value="ZOO-BER-04">ZOO-BER-04 (Riverside Zoo)</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label for="admin-email" class="form-label">Administrator Email</label>
                <input
                  type="email"
                  id="admin-email"
                  name="email"
                  class="pill-input"
                  placeholder="admin@zoo-authority.org"
                  required
                />
              </div>

              <div class="form-group">
                <label for="admin-password" class="form-label">Password</label>
                <input
                  type="password"
                  id="admin-password"
                  name="password"
                  class="pill-input"
                  placeholder="••••••••"
                  required
                />
              </div>

              <div class="auth-submit-row">
                <button type="submit" class="action-btn">Sign In</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </main>

    <script type="module">
      import { saveUser } from './js/auth.js';
      import { setupFormValidation } from './js/forms.js';
      import './js/nav.js';

      const form = document.getElementById('admin-login-form');
      setupFormValidation(form, async (data) => {
        saveUser({
          role: 'admin',
          zooId: data.zooId,
          email: data.email,
          signedInAt: new Date().toISOString()
        });
        window.location.href = 'admin-zookeeper-creator.html';
      });
    </script>
  </body>
</html>
