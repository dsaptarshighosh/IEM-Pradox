<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in as Zookeeper - Living Lens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Iosevka+Charon:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body>
    <header id="navbar"></header>

    <main class="page-wrapper">
      <div class="auth-panel-container">
        <section class="panel">
          <header class="panel-header">
            <h2>Sign in as Zookeeper</h2>
          </header>

          <div class="panel-body">
            <form id="zookeeper-login-form" novalidate>
              <div class="form-group">
                <label for="zoo-select" class="form-label">Zoo ID</label>
                <input
                  type="text"
                  id="zoo-select"
                  name="zoo_id"
                  class="pill-input"
                  placeholder="Enter your Zoo ID"
                  required
                />
              </div>

              <div class="form-group">
                <label for="keeper-username" class="form-label">Username</label>
                <input
                  type="text"
                  id="keeper-username"
                  name="username"
                  class="pill-input"
                  placeholder="Enter your username"
                  required
                />
              </div>

              <div class="form-group">
                <label for="badge-id" class="form-label">Keeper ID</label>
                <input
                  type="text"
                  id="badge-id"
                  name="keeper_id"
                  class="pill-input"
                  placeholder="e.g. ZK-4819"
                  required
                />
              </div>

              <div class="auth-submit-row">
                <button type="submit" class="action-btn">Sign In</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </main>

    <script type="module">
      import { saveUser } from './js/auth.js';
      import { setupFormValidation, showError } from './js/forms.js';
      import { keeperLogin } from './js/api.js';
      import './js/nav.js';

      const form = document.getElementById('zookeeper-login-form');
      setupFormValidation(form, async (data) => {
        try {
          const payload = {
            username: data.username,
            keeper_id: data.keeper_id,
            zoo_id: data.zoo_id
          };

          const response = await keeperLogin(payload);

          saveUser({
            role: 'zookeeper',
            username: response?.username || payload.username,
            keeper_id: response?.keeper_id || payload.keeper_id,
            zoo_id: response?.zoo_id || payload.zoo_id,
            ...response,
            signedInAt: new Date().toISOString()
          });

          window.location.href = 'observations.html';
        } catch (error) {
          const input = document.getElementById('badge-id');
          showError(input, error.message || 'Unable to sign in. Please check your credentials.');
        }
      });
    </script>
  </body>
</html>
