<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Past Observations - Living Lens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Iosevka+Charon:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body>
    <header id="navbar"></header>

    <main class="page-wrapper">
      <section class="panel">
        <header class="panel-header">
          <h2>Your Past Observations</h2>
          <a href="upload-observation.html" class="action-btn" style="font-size: 15px; padding: 8px 18px;">
            Upload Observation
          </a>
        </header>

        <div class="panel-body">
          <div class="form-group" style="max-width: 420px;">
            <label for="protected-area-filter" class="form-label">Protected area</label>
            <div class="select-wrapper">
              <select id="protected-area-filter" class="pill-input">
                <option value="">All protected areas</option>
              </select>
            </div>
          </div>
          <div id="observations-container" class="observations-grid">
            <!-- Rendered by js/data.js -->
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import { requireRole, getCurrentUser } from './js/auth.js';
      import { getObservations, predictHazard } from './js/data.js';
      import { protectedAreas, getProtectedAreaName } from './js/protected-areas.js';
      import './js/nav.js';

      if (requireRole('forest_officer')) {
        const container = document.getElementById('observations-container');
        const areaFilter = document.getElementById('protected-area-filter');
        const user = getCurrentUser();
        protectedAreas.forEach((area) => {
          areaFilter.add(new Option(`${area.name} — ${area.district}`, area.id));
        });
        const assignedAreaId = user?.protected_area_id || user?.protectedAreaId || user?.assigned_protected_area_id;
        if (assignedAreaId && protectedAreas.some(({ id }) => id === assignedAreaId)) {
          areaFilter.value = assignedAreaId;
        }

        async function reestimateHazardProbability(observation) {
          if (observation.hazardProbability != null) return observation;

          try {
            const prediction = await predictHazard({
              animal: observation.animal,
              behaviour: observation.observedBehaviour,
              intensity: Number(observation.intensity),
              abnormality_percentage: observation.abnormalityPercentage,
              duration_minutes: observation.durationMinutes
            });
            const probability = Number(
              prediction?.hazard_probability ??
              prediction?.hazardProbability ??
              prediction?.probability
            );

            if (!Number.isFinite(probability)) {
              throw new Error('Prediction response did not include a hazard probability.');
            }

            return { ...observation, hazardProbability: probability, hazardProbabilityReestimated: true };
          } catch (error) {
            console.error(`Failed to re-estimate hazard probability for observation ${observation.id}:`, error);
            return observation;
          }
        }

        async function loadObservations() {
          container.innerHTML = '<p style="padding: 16px; color: #024123;">Loading observations...</p>';

          try {
            const observations = await getObservations();

            if (!observations || observations.length === 0) {
              container.innerHTML = '<p style="padding: 16px; color: #024123;">No observations found.</p>';
              return;
            }

            const observationsWithProbabilities = await Promise.all(observations.map(reestimateHazardProbability));
            const filteredObservations = areaFilter.value
              ? observationsWithProbabilities.filter((obs) => obs.protected_area_id === areaFilter.value)
              : observationsWithProbabilities;

            if (!filteredObservations.length) {
              container.innerHTML = '<p style="padding: 16px; color: #024123;">No observations found for this protected area.</p>';
              return;
            }

            container.innerHTML = filteredObservations.map(obs => `
              <div class="observation-card">
                <p><strong>Wildlife species:</strong> ${obs.animal || 'Unknown species'}</p>
                <p><strong>Protected area:</strong> ${getProtectedAreaName(obs.protected_area_id) || 'Not available'}</p>
                <p><strong>Observed Behaviour:</strong></p>
                <p style="margin-top:-4px; color:#194f38;">${obs.observedBehaviour || 'No behaviour recorded'}</p>
                <p><strong>Abnormality Percentage:</strong> ${Number(obs.abnormalityPercentage ?? 0).toFixed(0)}%</p>
                <p><strong>Intensity:</strong> ${obs.intensity || 'Not provided'}</p>
                <p><strong>Duration of behaviour (minutes):</strong> ${Number(obs.durationMinutes ?? 0)}</p>
                <p><strong>Date:</strong> ${obs.createdAt ? new Date(obs.createdAt).toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata' }) : 'Not available'}</p>
                <p class="card-hazard" style="margin-top:4px;">${obs.hazardProbabilityReestimated ? 'Re-estimated hazard probability' : 'Hazard probability'}: ${obs.hazardProbability == null ? 'Not available' : `${Number(obs.hazardProbability).toFixed(2)}%`}</p>
              </div>
            `).join('');
          } catch (error) {
            console.error('Failed to fetch observations:', error);
            container.innerHTML = '<p style="padding: 16px; color: #024123;">Unable to load observations right now. Please try again later.</p>';
          }
        }

        areaFilter.addEventListener('change', loadObservations);
        loadObservations();
      }
    </script>
  </body>
</html>
